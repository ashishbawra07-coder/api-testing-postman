name: 🔌 Newman API Tests

on:
  workflow_dispatch:         # ✅ ONLY runs manually from GitHub Actions UI — no automatic triggers

permissions:
  checks: write
  contents: read

jobs:
  api-tests:
    name: 🧪 API Tests — ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false        # ✅ Don't cancel other env if one fails
      matrix:
        environment: [qa, staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'        # ✅ Works now — package-lock.json exists

      - name: Install Newman & reporters
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run API tests — ${{ matrix.environment }}
        run: |
          newman run collections/BookStore_API.postman_collection.json \
            -e environments/${{ matrix.environment }}.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export reports/${{ matrix.environment }}-results.xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ matrix.environment }}
          path: reports/
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'reports/*.xml'
          check_name: 'Newman Test Results — ${{ matrix.environment }}'
          fail_on_failure: false
